<!doctype html>
<html lang="{{ locale }}" data-theme="cms"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>CMS Learn</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"/><link rel="stylesheet" href="/static/app.css"/><script src="/static/htmx.min.js" defer=""></script></head><body class="min-h-dvh bg-base-100 text-base-content"><header class="navbar mx-auto max-w-5xl gap-4 border-b border-base-300 px-4"><a class="font-semibold tracking-tight" href="/">CMS Learn</a><nav class="ms-auto flex items-center gap-3 text-sm"><a class="link link-hover" href="/">{{ nav.curriculum }}</a><a class="link link-hover" href="/submissions">{{ nav.submissions }}</a><a class="btn btn-sm btn-primary" href="/signin">{{ nav.sign_in }}</a><a class="btn btn-ghost btn-sm" href="?lang={{ other_locale }}" hrefLang="{{ other_locale }}">{{ other_locale_label }}</a></nav></header><main class="mx-auto max-w-5xl px-4 py-8"><h1 class="text-2xl font-semibold tracking-tight">{{ title }}</h1><p class="mt-1 opacity-70">{{ lede }}</p><p class="mt-4 text-sm text-error">{{ message }}</p><form class="mt-6 grid max-w-sm gap-4" action="{{ action }}" method="post"><label class="form-control"><span class="label-text">{{ email_label }}</span><input class="input input-bordered w-full" type="email" autoComplete="email" required="" name="email"/></label><label class="form-control"><span class="label-text">{{ handle_label }}</span><input class="input input-bordered w-full" type="text" autoComplete="username" required="" name="handle"/></label><label class="form-control"><span class="label-text">{{ password_label }}</span><input class="input input-bordered w-full" type="password" autoComplete="new-password" required="" name="password"/></label><button class="btn btn-primary mt-2" type="submit">{{ submit_label }}</button></form><p class="mt-6 text-sm"><a class="link link-hover" href="{{ signin_href }}">{{ signin_label }}</a></p></main><footer class="mx-auto max-w-5xl px-4 py-8 text-sm opacity-70">{{ footer.notice }}</footer></body></html>

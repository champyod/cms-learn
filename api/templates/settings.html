<!doctype html>
<html lang="{{ locale }}" data-theme="cms"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>CMS Learn</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"/><link rel="stylesheet" href="/static/app.css"/><script src="/static/htmx.min.js" defer=""></script></head><body class="min-h-dvh bg-base-100 text-base-content"><header class="navbar mx-auto max-w-5xl gap-4 border-b border-base-300 px-4"><a class="font-semibold tracking-tight" href="/">CMS Learn</a><nav class="ms-auto flex items-center gap-3 text-sm"><a class="link link-hover" href="/">{{ nav.curriculum }}</a><a class="link link-hover" href="/submissions">{{ nav.submissions }}</a><a class="btn btn-sm btn-primary" href="/signin">{{ nav.sign_in }}</a><a class="btn btn-ghost btn-sm" href="?lang={{ other_locale }}" hrefLang="{{ other_locale }}">{{ other_locale_label }}</a></nav></header><main class="mx-auto max-w-5xl px-4 py-8"><h1 class="text-2xl font-semibold tracking-tight">{{ title }}</h1><p class="mt-1 opacity-70">{{ lede }}</p><form class="mt-8 grid gap-4" action="{{ action }}" method="post"><ul class="contents">{% for setting in settings %}<div class="form-control"><label class="label" for="{{ id }}"><span class="label-text">{{ setting.description }}</span><span class="label-text-alt opacity-60">{{ setting.tier }}</span></label>{% if setting.tier == "secret" %}<input id="{{ id }}" type="password" class="input input-bordered w-full" autoComplete="new-password" name="{{ setting.key }}"/><label class="label"><span class="label-text-alt">{{ secret_hint }}</span></label>{% else %}<input id="{{ id }}" type="text" class="input input-bordered w-full" name="{{ setting.key }}" value="{{ setting.value }}"/>{% endif %}</div>{% endfor %}</ul><button class="btn btn-primary mt-2" type="submit">{{ submit_label }}</button></form></main><footer class="mx-auto max-w-5xl px-4 py-8 text-sm opacity-70">{{ footer.notice }}</footer></body></html>

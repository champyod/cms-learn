# cms-learn — single server. Template; deploy/docker-compose.yml is rendered from this file and
# release.toml by tools/render-stack.ts, and is never edited by hand.
#
# Rules encoded here, not in prose the operator has to remember:
#   - only `proxy` publishes ports; every other service listens on an internal network
#   - `internal` has no gateway, so the judge and the database cannot reach the internet at all
#   - every image comes from release.toml: a third-party image by digest, a local one by build context
#   - every service has a read-only root filesystem; the directories it writes are named as volumes,
#     and every mount into it is read-only except the cgroup tree `isolate` requires
#   - every service drops every capability and adds back only the ones its own job needs, named beside
#     the service and asserted by tools/check-deploy.sh (ADR 0060)
#   - every service has a memory, CPU and process limit, so one service cannot take the machine from
#     the others
#
# A service whose image is `{{image:...}}` is pinned in release.toml; the placeholder names the key
# there, not the service here.

name: cms-learn

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  labels:
    org.cmslearn.release: "{{version}}"
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Every service authenticates as its own database role (ADR 0058), and its password lives in a file only that service
# mounts: not in this file, not in a committed environment file, and not in a container's environment — the environment is
# readable from `docker inspect` and from anything with the socket. libpq reads PGPASSFILE itself, so the DSN the service
# is given carries no password at all.
secrets:
  api_db_password:       { file: ./secrets/api.pgpass }
  generator_db_password: { file: ./secrets/generator.pgpass }
  certifier_db_password: { file: ./secrets/certifier.pgpass }
  judge_db_password:     { file: ./secrets/judge.pgpass }
  bank_db_password:      { file: ./secrets/bank.pgpass }
  # The deployment owner's own credential. Two jobs legitimately need it and nothing else does: the schema
  # step applies DDL as the owner, and a full logical dump reads every table, which no service role is
  # granted. It is delivered exactly like the role files: a mounted file, copied to a mode libpq accepts.
  owner_db_password:     { file: ./secrets/owner.pgpass }

services:
  proxy:
    <<: *hardening
    build:
      context: ./proxy
    image: {{image:proxy}}
    ports:
      - "80:8080"          # container listens unprivileged; the host side keeps the public port
      - "443:8443"
      - "443:8443/udp"     # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      CROWDSEC_API_KEY: ${CROWDSEC_API_KEY:?set CROWDSEC_API_KEY in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data              # certificates; losing this only costs a re-issue
      - caddy-config:/config
      - caddy-logs:/var/log/caddy     # CrowdSec reads this
    # It terminates TLS as an unprivileged user on mapped ports, so no capability is added back.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks: [edge]
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256m
          pids: 256
    depends_on:
      crowdsec: { condition: service_started }
      api: { condition: service_started }

  api:
    <<: *hardening
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: {{image:api}}
    # 8080 is the public site, 8081 is the administrator panel. `expose` puts both on the `edge` network
    # without publishing either: the proxy is the only way in, and the panel answers only 8081.
    expose: ["8080", "8081"]
    environment:
      # The service takes every fact from the file this names — addresses, ports, the database URL, the
      # seal key, the socket. NOTHING else configures it, and a missing file stops it.
      CMSLEARN_HOST_FILE: /run/cms-learn/host.env
      # The password is in the mounted file, not in this environment: libpq reads it from here. The file is
      # created by the entrypoint below from the secret, because a secret mount is 0444 (readable by the
      # sandbox's other users) and libpq ignores a password file with a world-readable mode.
      PGPASSFILE: /tmp/api.pgpass
    # install writes the secret as the service user with the one mode libpq accepts. /tmp is the service's
    # tmpfs, so the copy never touches the image.
    entrypoint: ["/bin/sh", "-c", "install -m 600 /run/secrets/api_db_password /tmp/api.pgpass && exec /usr/local/bin/cms_api"]
      # Everything else the service decides at runtime comes from settings rows: registration,
      # approval, the domain allowlist, session lifetimes and the log level are all operator-editable
      # from the CLI and the panel, and none of them is a reason to recreate this container.
    # The image carries the three trees the service renders from, so the only thing mounted here is the
    # operator's own configuration: the file naming every fact this service takes.
    volumes:
      - ./host.env:/run/cms-learn/host.env:ro
    # The admin socket is the one file it creates, and /tmp is the only directory it can create it in.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    secrets:
      - api_db_password
    networks: [edge, internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 512
    depends_on:
      database: { condition: service_healthy }
      objects: { condition: service_healthy }

  judge:
    <<: *hardening
    build:
      context: ..
      dockerfile: judge/Dockerfile
    image: {{image:judge}}
    environment:
      # Its own role, and a DSN with no password in it: the credential is the mounted file. The runner
      # reads CMSLEARN_DATABASE_URL; DATABASE_URL was never its variable and named a connection nothing
      # opened.
      CMSLEARN_DATABASE_URL: postgres://cmslearn_judge_user@database:5432/${POSTGRES_DB:-cmslearn}
      # The file the runner reads, written from the secret by the entrypoint below: a secret mount is
      # 0444 (0777 on a runner whose daemon does not apply the mode), and libpq ignores both.
      PGPASSFILE: /tmp/judge.pgpass
      ISOLATE_CGROUP_PATH: ${ISOLATE_CGROUP_PATH:-/sys/fs/cgroup/cms-learn-isolate}
    # isolate creates namespaces, mounts the box and /proc, raises its loopback and switches to the box user,
    # so it is the one service that needs capabilities back. Each one below was removed in turn and isolate
    # stopped at a named step: SYS_ADMIN mounts the box tree, SYS_CHROOT enters the box, SETUID/SETGID switch
    # to the box uid, CHOWN gives it the box tree, DAC_OVERRIDE reads the executable, FOWNER chmods the box's
    # own /tmp, NET_ADMIN raises lo. seccomp is unconfined because isolate's clone flags are not in Docker's
    # default profile; no-new-privileges still holds, and is repeated because a security_opt list replaces
    # the anchor's rather than merging with it.
    cgroup: host
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_ADMIN
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - judge-work:/var/lib/cms-learn/work
    # isolate keeps its boxes and locks under /var/lib/isolate and /run/isolate; the boxes hold the compiled
    # program that is executed, so that tree must allow exec.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
      - /var/lib/isolate:rw,exec,nosuid,nodev,size=512m
      - /run/isolate:rw,noexec,nosuid,nodev,size=64m
    # The same shape as the api: copy the secret to a file the client accepts, then run the runner. The loop
    # is the image's entrypoint, repeated here because an entrypoint that installs the file replaces it.
    entrypoint:
      - /bin/sh
      - -c
      - |
        install -m 600 /run/secrets/judge_db_password /tmp/judge.pgpass &&
        exec /bin/sh -c 'while :; do /usr/local/bin/cms_judge_run --isolate /usr/bin/isolate --checker /usr/local/bin/cms_checker_token --worker "$(hostname)" || sleep 2; done'
    secrets:
      - judge_db_password
    networks: [internal]          # no gateway: a submission cannot reach the internet
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
          pids: 512
    depends_on:
      database: { condition: service_healthy }

  database:
    <<: *hardening
    image: {{image:database}}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmslearn}
      POSTGRES_USER: ${POSTGRES_USER:-cmslearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The image's entrypoint starts as root to make the data directory belong to its own user, which is what
    # the four capabilities below are for; the socket directory is a tmpfs created at start.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=32m,mode=1777
    # Bound to loopback only: the operator reaches it through an SSH tunnel, nothing else can.
    ports:
      - "127.0.0.1:5432:5432"
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
          pids: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmslearn} -d ${POSTGRES_DB:-cmslearn}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  crowdsec:
    <<: *hardening
    image: {{image:crowdsec}}
    environment:
      GIN_MODE: release
      # Caddy writes JSON access logs; this collection carries the parser for that shape.
      COLLECTIONS: crowdsecurity/caddy
      # AppSec is not a collection: the rules come from their own hub type. The engine installs them
      # before the listener starts, which is why the Caddyfile's appsec_url has something to reach.
      APPSEC_RULES: crowdsecurity/crs
    volumes:
      - crowdsec-db:/var/lib/crowdsec/data
      - crowdsec-etc:/etc/crowdsec
      - caddy-logs:/var/log/caddy:ro
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.d/caddy.yaml:ro
      # The AppSec datasource (the listener) and the in-band config that loads the CRS rules. Without
      # these two files the rules are installed and the port has no listener.
      - ./crowdsec/appsec.yaml:/etc/crowdsec/acquis.d/appsec.yaml:ro
      - ./crowdsec/appsec-config.yaml:/etc/crowdsec/appsec-configs/cms-learn/inband.yaml:ro
      # A whole file: the in-band block files a waf alert with remediation false, and this profile is
      # what turns that alert into a ban the next request is refused by.
      - ./crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks: [edge]
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256m
          pids: 128
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prometheus:
    <<: *hardening
    image: {{image:prometheus}}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks: [internal, edge]    # edge only to be scrapeable; nothing publishes it
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
          pids: 128
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    <<: *hardening
    image: {{image:grafana}}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    ports:
      - "127.0.0.1:3001:3000"     # loopback only; reach it through an SSH tunnel
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256m
          pids: 256
    depends_on:
      prometheus: { condition: service_started }

  node-exporter:
    <<: *hardening
    image: {{image:node-exporter}}
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64m
          pids: 64

  backup:
    <<: *hardening
    build:
      context: ./backup
    image: {{image:backup}}
    environment:
      # No password in the URL or the environment: the owner's file is mounted and copied where libpq reads it.
      DATABASE_URL: postgres://${POSTGRES_USER:-cmslearn}@database:5432/${POSTGRES_DB:-cmslearn}
      PGPASSFILE: /tmp/owner.pgpass
      AGE_PUBLIC_KEY: ${AGE_PUBLIC_KEY:?set AGE_PUBLIC_KEY in .env}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-7}
    entrypoint: ["/bin/sh", "-c", "install -m 600 /run/secrets/owner_db_password /tmp/owner.pgpass && exec /usr/local/bin/run.sh"]
    secrets:
      - owner_db_password
    volumes:
      - backups:/backups
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    networks: [internal, edge]    # edge for the offsite sync, never for inbound
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128m
          pids: 64
    depends_on:
      database: { condition: service_healthy }

  schema:
    <<: *hardening
    # Built from this checkout, like the proxy and the backup: the release calls it built, so the stack
    # must carry the build section or `compose build schema` produces nothing and the migrate step pulls
    # an image that was never made.
    build:
      context: ./schema
    image: {{image:schema}}
    # One shot, run by the upgrade before any service is switched. The plan and the wrapper are
    # mounted from the checkout that rendered this stack, read-only, so the digests verified are the
    # digests of the files that were reviewed.
    profiles: ["migrate"]
    restart: "no"
    environment:
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-cmslearn}
      PGUSER: ${POSTGRES_USER:-cmslearn}
      PGPASSFILE: /tmp/owner.pgpass
    entrypoint: ["/bin/sh", "-c", "install -m 600 /run/secrets/owner_db_password /tmp/owner.pgpass && exec bash /app/tools/apply-plan.sh"]
    secrets:
      - owner_db_password
    volumes:
      - ../deploy/plan:/app/deploy/plan:ro
      - ../tools:/app/tools:ro
      # The wrapper resolves the pgschema pin from docs/dependencies.md; without this mount the file is
      # missing exactly where the container looks for it.
      - ../docs/dependencies.md:/app/docs/dependencies.md:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
          pids: 64
    depends_on:
      database: { condition: service_healthy }

  objects:
    <<: *hardening
    image: {{image:objects}}
    # One process holds every role — master, volume server, filer and the S3 gateway — with every
    # byte under /data. The credential below is what the gateway validates: with it set, a request
    # without a valid signature is refused, and the network is a second boundary rather than the only
    # one (ADR 0023). It comes from .env and is never written into a tracked file.
    command: ["server", "-s3", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${CMSLEARN_S3_ACCESS_KEY_ID:?set CMSLEARN_S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${CMSLEARN_S3_SECRET_ACCESS_KEY:?set CMSLEARN_S3_SECRET_ACCESS_KEY in .env}
    expose: ["8333"]
    volumes:
      - objectdata:/data
    # Its entrypoint drops from root to its own user, which is what the two capabilities are for.
    cap_add:
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
          pids: 256

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
  pgdata:
  objectdata:
  judge-work:
  crowdsec-db:
  crowdsec-etc:
  prom-data:
  grafana-data:
  backups:

networks:
  edge:
  internal:
    internal: true

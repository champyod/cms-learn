# Scrape targets for cms-learn. Short retention and a 30s interval: a single box with 30-60 students
# produces no metric volume worth tuning for.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: cms-learn

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # The api exposes /metrics on its own listener once it exists; until then this target is simply
  # down, which is the honest state and shows up as such on the dashboard.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  # Judge queue depth is the metric that predicts a stuck contest: submissions waiting, oldest
  # waiting age, sandbox failures. Planned listener on the judge's own port.
  - job_name: judge
    static_configs:
      - targets: ["judge:9101"]

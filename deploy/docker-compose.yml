# cms-learn — single server.
#
# Rules encoded here, not in prose the operator has to remember:
#   - only `proxy` publishes ports; every other service listens on an internal network
#   - `internal` has no gateway, so the judge and the database cannot reach the internet at all
#   - every image is pinned (tag from .env during dev, digest in production)
#   - nothing is installed on the host; the only host mounts are read-only (/sys, /proc) and the
#     cgroup tree that `isolate` requires
#
# Web, api and judge images are built by CI once those services exist. `docker compose config`
# validates this file today; `up` needs the three images.

name: cms-learn

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  proxy:
    <<: *hardening
    build:
      context: ./proxy
    image: ghcr.io/champyod/cms-learn-proxy:${TAG:-dev}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"      # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      CROWDSEC_API_KEY: ${CROWDSEC_API_KEY:?set CROWDSEC_API_KEY in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data              # certificates; losing this only costs a re-issue
      - caddy-config:/config
      - caddy-logs:/var/log/caddy     # CrowdSec reads this
    networks: [edge]
    depends_on:
      crowdsec: { condition: service_started }
      api: { condition: service_started }
      web: { condition: service_started }

  web:
    <<: *hardening
    image: ghcr.io/champyod/cms-learn-web:${TAG:-dev}
    expose: ["3000"]
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8080
    networks: [edge]
    depends_on:
      api: { condition: service_started }

  api:
    <<: *hardening
    image: ghcr.io/champyod/cms-learn-api:${TAG:-dev}
    expose: ["8080"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cmslearn}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@database:5432/${POSTGRES_DB:-cmslearn}
      # Registration and approval are runtime switches, not build-time flags: a pilot class turns
      # approval on, a public demo turns it off, and neither needs a redeploy of the app.
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      APPROVAL_REQUIRED: ${APPROVAL_REQUIRED:-true}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-720}
      RUST_LOG: ${RUST_LOG:-info}
    networks: [edge, internal]
    depends_on:
      database: { condition: service_healthy }

  judge:
    <<: *hardening
    image: ghcr.io/champyod/cms-learn-judge:${TAG:-dev}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cmslearn}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@database:5432/${POSTGRES_DB:-cmslearn}
      ISOLATE_CGROUP_PATH: ${ISOLATE_CGROUP_PATH:-/sys/fs/cgroup/cms-learn-isolate}
    # isolate needs the host cgroup tree and an unconfined seccomp profile — the same shape the
    # contest worker uses. It is the one container allowed to loosen the default.
    cgroup: host
    security_opt:
      - seccomp:unconfined
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - judge-work:/var/lib/cms-learn/work
    networks: [internal]          # no gateway: a submission cannot reach the internet
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    depends_on:
      database: { condition: service_healthy }

  database:
    <<: *hardening
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmslearn}
      POSTGRES_USER: ${POSTGRES_USER:-cmslearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to loopback only: the operator reaches it through an SSH tunnel, nothing else can.
    ports:
      - "127.0.0.1:5432:5432"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmslearn} -d ${POSTGRES_DB:-cmslearn}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  crowdsec:
    <<: *hardening
    image: crowdsecurity/crowdsec:v1.8.1
    environment:
      GIN_MODE: release
      # Caddy writes JSON access logs; this collection carries the parser for that shape.
      COLLECTIONS: crowdsecurity/caddy
    volumes:
      - crowdsec-db:/var/lib/crowdsec/data
      - crowdsec-etc:/etc/crowdsec
      - caddy-logs:/var/log/caddy:ro
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.d/caddy.yaml:ro
    networks: [edge]
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    networks: [internal, edge]    # edge only to be scrapeable; nothing publishes it
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"     # loopback only; reach it through an SSH tunnel
    networks: [internal]
    depends_on:
      prometheus: { condition: service_started }

  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [internal]

  backup:
    <<: *hardening
    build:
      context: ./backup
    image: ghcr.io/champyod/cms-learn-backup:${TAG:-dev}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cmslearn}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@database:5432/${POSTGRES_DB:-cmslearn}
      AGE_PUBLIC_KEY: ${AGE_PUBLIC_KEY:?set AGE_PUBLIC_KEY in .env}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-7}
    volumes:
      - backups:/backups
    networks: [internal, edge]    # edge for the offsite sync, never for inbound
    depends_on:
      database: { condition: service_healthy }

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
  pgdata:
  judge-work:
  crowdsec-db:
  crowdsec-etc:
  prom-data:
  grafana-data:
  backups:

networks:
  edge:
  internal:
    internal: true

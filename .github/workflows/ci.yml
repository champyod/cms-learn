name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Nightly, because the full lane builds the api and then falsifies the gate: too slow for a pull
  # request, and the defects it catches are the ones that only appear in that half of the tree.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Force a failure so the Discord notification path can be tested"
        type: boolean
        default: false

# One run per ref: a second push supersedes the first rather than racing it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content:
    name: content gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: install
        run: bun install --frozen-lockfile

      - name: content integrity
        run: bun run validate

      # Manual runs can force the red path, so the notification job is exercised on purpose rather
      # than only ever skipped on green runs.
      - name: simulated failure (manual runs only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.simulate_failure == 'true'
        run: |
          echo "::error::simulated failure — testing the notification path"
          exit 1

      # Deliberately a separate step, not folded into the one above: a gate that only ever prints OK
      # is a gate nobody has seen fail, and this is the step that keeps it honest.
      - name: gate falsifiability
        run: bun run validate:falsify

  references:
    name: reference solutions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: build and run every reference against its own examples
        run: bash tools/check-references.sh

      - name: reference gate falsifiability
        run: bun run check:references:falsify

  # The compose file is a security contract: ports, isolation, pinning, the Caddyfile and the
  # Prometheus config are asserted here, and the assertion is itself proven to fail.
  deploy-contract:
    name: deployment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: deployment invariants
        run: bash tools/check-deploy.sh

      - name: deploy gate falsifiability
        run: bun run check:deploy:falsify

      - name: upgrade order and health gate
        run: |
          bun run check:upgrade
          bun run check:upgrade:falsify

      # The isolation gate drives the sandbox container, so it belongs with the lane that already runs docker.
      - name: sandbox isolation
        run: bun run check:isolation

  # Scanning is a gate, not a report someone reads later: a leaked token or a root-user Dockerfile
  # fails the build, and the scan is itself proven to catch planted defects.
  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: secrets, vulnerable dependencies, deployment hardening
        run: bash tools/security-scan.sh

      - name: scan falsifiability
        run: bun run check:security:falsify

  # Every gate that needs only bun, a PostgreSQL server and pgschema. The gates that need the C++ build run
  # in the full lane after it builds; the ones that need docker run in the deploy and security jobs. A gate
  # in no job is a gate nobody runs, which is the state this matrix exists to end.
  gates:
    name: gate matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: install
        run: bun install --frozen-lockfile

      # The database gates start a scratch cluster, so they need the server binaries rather than a client.
      - name: postgres server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql

      - name: schema gate
        run: |
          bun run check:schema
          bun run check:schema:falsify

      - name: package manager gate
        run: |
          bun run check:pm
          bun run check:pm:falsify

      - name: control client gate
        run: |
          bun run check:cli
          bun run check:cli:falsify

      - name: template and island gates
        run: |
          bun run check:templates
          bun run falsify:templates
          bun run check:island
          bun run falsify:island

      - name: settings and catalogue gates
        run: |
          bun run check:settings
          bun run falsify:settings
          bun run check:catalogue

      - name: stack gate
        run: |
          bun run check:stack
          bun run check:stack:falsify

  # C++ sits on the internet-facing path (ADR 0006), so its safety is a gate and not a promise. CMake
  # presets own the sanitizer and warning flags, ctest owns pass/fail per example, clang-tidy owns the
  # defect classes a runtime sanitizer cannot see, and tools/cpp/gate.ts only reports what they said.
  # The gate is then falsified: a use-after-free, a signed overflow, a stack overflow, a warning-as-error
  # and a static-analysis-only defect must each be caught by name.
  #
  # Two lanes, one toolchain: both compile under C++26 with the compiler the api image ships (gcc 16.2.0)
  # and both resolve packages from the same pinned vcpkg baseline. They differ in what they compile — this
  # lane skips the api build, which is the slow half, so a pull request gets a verdict in minutes, while
  # `cpp-full` is the lane that gates the api.
  cpp-fast:
    name: cpp fast
    runs-on: ubuntu-latest
    container: gcc:16.2.0-trixie
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
    steps:
      - uses: actions/checkout@v4

      # The image carries the compiler; these are the parts of the toolchain it does not. No sudo:
      # container steps already run as root. cmake_minimum_required in CMakeLists.txt is the real floor.
      - name: toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build make clang clang-tidy git curl ca-certificates zip unzip tar pkg-config

      # vcpkg is not optional in this lane: the bank needs its packages whether or not the api is built,
      # so the fast lane skips the api build rather than skipping the package tree.
      - name: vcpkg checkout
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "${VCPKG_ROOT}"
          git -C "${VCPKG_ROOT}" checkout --quiet ab9a05e70421507222d83861ac1a31be7e4272d4

      # The key carries the image tag on purpose: a vcpkg binary archive is keyed by an ABI hash that
      # includes the compiler, so a cache built by another gcc would either miss or hand back a binary
      # this compiler cannot link. Move the tag here whenever the container tag moves.
      - name: vcpkg package cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.vcpkg-root/downloads
            ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-gcc16.2.0-trixie-${{ hashFiles('api/vcpkg.json', 'api/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-gcc16.2.0-trixie-

      - name: vcpkg bootstrap
        run: $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics

      - uses: oven-sh/setup-bun@v2

      - name: build, run and analyse
        env:
          CMS_CPP_PRESET: safety-core
        run: bun run check:cpp

  # The full lane: the same compiler and the same baseline, but the api is compiled too. The api build and
  # the falsification run are the slow half, so they run where nobody is waiting on them — a push to a
  # gated branch, a manual run, or the nightly schedule.
  cpp-full:
    name: cpp full
    runs-on: ubuntu-latest
    container: gcc:16.2.0-trixie
    if: github.event_name != 'pull_request'
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build make clang clang-tidy git curl ca-certificates zip unzip tar pkg-config

      - name: vcpkg checkout
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "${VCPKG_ROOT}"
          git -C "${VCPKG_ROOT}" checkout --quiet ab9a05e70421507222d83861ac1a31be7e4272d4

      # Same key as the fast lane, and for the same reason: one package tree, one compiler.
      - name: vcpkg package cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.vcpkg-root/downloads
            ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-gcc16.2.0-trixie-${{ hashFiles('api/vcpkg.json', 'api/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-gcc16.2.0-trixie-

      - name: vcpkg bootstrap
        run: $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics

      - name: postgres server
        run: |
          apt-get update
          apt-get install -y --no-install-recommends postgresql postgresql-client

      - uses: oven-sh/setup-bun@v2

      - name: build, run and analyse
        run: bun run check:cpp

      - name: safety gate falsifiability
        run: bun run check:cpp:falsify

      # The gates below read the binaries this lane just built, which is why they live here rather than in
      # the matrix job: a gate that skips for want of a binary is a gate that proves nothing.
      - name: database, content and query gates
        run: |
          bun run check:db
          bun run check:content:db
          bun run check:unseen
          bun run check:visibility
          bun run check:visibility:falsify

      - name: verifier, judge and render gates
        run: |
          bun run check:verify
          bun run check:judge
          bun run check:judge:falsify
          bun run check:render

      - name: live database cases
        run: bun run check:live

      - name: generation and publish gates
        run: |
          bun run check:generator
          bun run falsify:generator
          bun run check:publish
          bun run falsify:publish

      - name: workspace scaffold gate
        run: bun run check:scaffold

  # CD is not wired yet: there is no image to build and no host to deploy to (F-061/F-062 are
  # planned). This job exists so a deploy step has one obvious place to land, and so CI says so out
  # loud instead of implying a pipeline that does not exist.
  deploy-state:
    name: deployment
    runs-on: ubuntu-latest
    needs: [content, references, deploy-contract, security, cpp-fast, cpp-full]
    # cpp-full is skipped on pull requests, and a job whose dependency was skipped is skipped too,
    # so without this the deployment report disappears from every PR.
    if: always()
    steps:
      - name: report
        run: |
          echo "::notice::No deployment target yet — F-061 (containers) and F-062 (ingress/TLS) are planned. CI only."

  notify:
    name: discord
    runs-on: ubuntu-latest
    needs: [content, references, deploy-contract, security, cpp-fast, cpp-full]
    if: failure() && github.event_name != 'pull_request'
    steps:
      # The webhook is a credential, so it lives only in repository secrets and is never echoed.
      # No secret means no notification, reported as a notice rather than a green step pretending to
      # have told anyone.
      - name: post failure to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::notice title=Discord::DISCORD_WEBHOOK_URL is not set — notification skipped"
            exit 0
          fi
          payload="$(jq -n \
            --arg repo "$REPO" --arg branch "$BRANCH" --arg sha "${SHA:0:7}" \
            --arg actor "$ACTOR" --arg url "$RUN_URL" \
            '{content: ("**CI failed** — `" + $repo + "` @ `" + $branch + "` (" + $sha + ") by " + $actor + "\nNo deploy happened. Run: " + $url)}')"
          curl -fsS -H "Content-Type: application/json" -d "$payload" "$WEBHOOK" >/dev/null
          echo "notified Discord"
